name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-release:
    name: Verify release gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release verification
        run: npm run verify:release
        env:
          NEURAL_UI_BUNDLE_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}

      - name: Upload compiled package
        uses: actions/upload-artifact@v7
        with:
          name: neural-ui-core-dist
          path: dist/neural-ui/core
          if-no-files-found: error

      - name: Upload npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: neural-ui-core-npm
          path: |
            dist/release/neural-ui-core-*.tgz
            !dist/release/*-sourcemaps.tgz
            dist/release/release-manifest.json
          if-no-files-found: error

      - name: Upload source-map artifact
        uses: actions/upload-artifact@v7
        with:
          name: neural-ui-core-sourcemaps
          path: dist/release/*-sourcemaps.tgz
          if-no-files-found: error
