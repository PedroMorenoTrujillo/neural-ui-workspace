name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-release:
    name: Verify release gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release verification
        run: npm run verify:release:automated

      - name: Upload compiled package
        uses: actions/upload-artifact@v7
        with:
          name: neural-ui-core-dist
          path: dist/neural-ui/core
          if-no-files-found: error
