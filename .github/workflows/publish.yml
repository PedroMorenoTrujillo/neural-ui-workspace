name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-release:
    if: github.repository == 'PedroMorenoTrujillo/neural-ui-workspace' && github.actor == 'PedroMorenoTrujillo' && github.triggering_actor == 'PedroMorenoTrujillo'
    name: Verify release gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run release verification
        run: |
          node --test scripts/npm-release-channel.spec.mjs
          npm run verify:release
        env:
          NEURAL_UI_BUNDLE_PROFILE: release
          NEURAL_UI_ANGULAR_22_CONSUMER: '1'

      - name: Upload npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: neural-ui-core-npm
          path: |
            dist/release/neural-ui-core-*.tgz
            !dist/release/*-sourcemaps.tgz
            dist/release/release-manifest.json
          if-no-files-found: error

      - name: Upload source-map artifact
        uses: actions/upload-artifact@v7
        with:
          name: neural-ui-core-sourcemaps
          path: dist/release/*-sourcemaps.tgz
          if-no-files-found: error

  publish:
    if: github.repository == 'PedroMorenoTrujillo/neural-ui-workspace' && github.actor == 'PedroMorenoTrujillo' && github.triggering_actor == 'PedroMorenoTrujillo'
    name: Publish package
    runs-on: ubuntu-24.04
    needs: [verify-release]

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup npm for Trusted Publishing
        run: npm install --global npm@11.19.0

      - name: Download npm artifact
        uses: actions/download-artifact@v8
        with:
          name: neural-ui-core-npm
          path: dist/release

      - name: Download source-map artifact
        uses: actions/download-artifact@v8
        with:
          name: neural-ui-core-sourcemaps
          path: dist/release

      - name: Reverify linked release artifacts
        run: npm run verify:release-artifacts -- --archives-only

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./dist/release/release-manifest.json').package.version")
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: |
          PACKAGE_TARBALL=$(node -p "require('./dist/release/release-manifest.json').npm.file")
          DIST_TAG=$(node scripts/npm-release-channel.mjs)
          npm publish "dist/release/$PACKAGE_TARBALL" --access public --tag "$DIST_TAG" --provenance
