name: Publish to npm

on:
  push:
    tags:
      - 'v1.*'

jobs:
  verify-release:
    name: Verify release gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run release verification
        run: npm run verify:release
        env:
          NEURAL_UI_BUNDLE_PROFILE: release

      - name: Upload npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: neural-ui-core-npm
          path: |
            dist/release/neural-ui-core-*.tgz
            !dist/release/*-sourcemaps.tgz
            dist/release/release-manifest.json
          if-no-files-found: error

      - name: Upload source-map artifact
        uses: actions/upload-artifact@v7
        with:
          name: neural-ui-core-sourcemaps
          path: dist/release/*-sourcemaps.tgz
          if-no-files-found: error

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: [verify-release]

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup npm for Trusted Publishing
        run: npm install --global npm@11.19.0

      - name: Download npm artifact
        uses: actions/download-artifact@v8
        with:
          name: neural-ui-core-npm
          path: dist/release

      - name: Download source-map artifact
        uses: actions/download-artifact@v8
        with:
          name: neural-ui-core-sourcemaps
          path: dist/release

      - name: Reverify linked release artifacts
        run: npm run verify:release-artifacts -- --archives-only

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./dist/release/release-manifest.json').package.version")
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
            exit 1
          fi
          case "$PACKAGE_VERSION" in
            1.*) ;;
            *) echo "Maintenance workflow only publishes v1 packages"; exit 1 ;;
          esac
          git merge-base --is-ancestor HEAD origin/maintenance/v1

      - name: Publish to npm
        run: |
          PACKAGE_TARBALL=$(node -p "require('./dist/release/release-manifest.json').npm.file")
          npm publish "dist/release/$PACKAGE_TARBALL" --access public --tag legacy
